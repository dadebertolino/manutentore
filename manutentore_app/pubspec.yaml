name: manutentore
description: >-
  Breviario del manutentore: calcolatori per diagnostica e riparazione,
  elettrici e meccanici. Offline, senza account, senza raccolta dati.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Unica dipendenza esterna: persistenza locale di preferiti e impostazioni.
  # Prima di aggiungerne altre leggere HANDOFF.md, sezione "Vincoli".
  shared_preferences: ^2.3.0
  manutentore_core:
    path: ../manutentore_core
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # IBM Plex, self-hosted in assets/fonts/, mai da CDN (HANDOFF.md §5).
  # Ci sono solo i cinque pesi che la UI usa davvero (400/500/600, niente
  # corsivi): sono ~950 kB, e ogni file in piu' e' peso che il manutentore si
  # scarica per niente. Se serve un peso nuovo, aggiungi il .ttf e la riga qui.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
